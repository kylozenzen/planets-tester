<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planet Strength</title>
  <meta name="application-name" content="Planet Strength" />
  <meta name="apple-mobile-web-app-title" content="Planet Strength" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Planet Strength is a calm, simple tracker for Today’s Workout." />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="color-scheme" content="light dark" />
  <link id="manifest-placeholder" rel="manifest" href="manifest.json" />
  <style>
    html, body { background:#070B14; margin:0; }
    #boot-splash{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(1200px 600px at 30% 20%, rgba(139,92,246,.25), transparent 60%),
                 radial-gradient(900px 500px at 80% 30%, rgba(239,68,68,.18), transparent 55%),
                 #070B14;
      color:#E5E7EB; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      z-index:9999;
    }
    #boot-splash .card{
      text-align:center; padding:20px 22px; border-radius:18px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
    }
    #boot-splash .title{ font-weight:900; font-size:22px; letter-spacing:.2px; }
    #boot-splash .sub{ margin-top:6px; font-size:13px; opacity:.75; }
    #boot-splash .dots{ margin-top:14px; font-size:18px; letter-spacing:3px; opacity:.9; animation:pulse 1.2s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>
  <link id="app-icon" rel="icon" href="icons/icon-192.svg" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="" />
  <link rel="stylesheet" href="style.css" />
  <script>tailwind = { disableWarning: true }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="app-shell">
  <div id="boot-splash" aria-hidden="true">
    <div class="card">
      <div class="title">Planet Strength</div>
      <div class="sub">Loading your day…</div>
      <div class="dots">•••</div>
    </div>
  </div>
  <div id="root"></div>
  <div id="install-prompt" aria-live="polite"></div>

  <!-- Data files (plain JS, no JSX needed) -->
  <script src="data/constants.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/workoutPlans.js"></script>

  <!-- Custom hooks (plain JS, uses global React) -->
  <script src="hooks/storage.js"></script>
  <script src="hooks/useDebounce.js"></script>
  <script src="hooks/usePersistedState.js"></script>
  <script src="hooks/useToast.js"></script>
  <script src="hooks/useModal.js"></script>

  <!-- Contexts (JSX, needs Babel) -->
  <script type="text/babel" src="hooks/SettingsContext.jsx"></script>

  <!-- Components (JSX, needs Babel) -->
  <script type="text/babel" src="components/Icon.jsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <!-- App logic -->
  <script type="text/babel" data-presets="env,react" src="script.js"></script>
</body>
</html>
